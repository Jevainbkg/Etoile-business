# Espace admin Pages CMS (app.pagescms.org) — Etoile Business
# Chaque enregistrement crée un commit sur main ; Vercel régénère le site (python3 _source/build.py).
media:
  input: site/img/uploads
  output: /img/uploads
  categories:
  - image
  rename: safe
content:
- name: reglages
  label: Coordonnées, agences et taux
  type: file
  path: contenu/site.json
  format: json
  fields:
  - name: indexer
    label: Ouvrir le site à Google
    type: boolean
    description: À activer seulement quand toutes les informations [À REMPLACER] sont remplies.
  - name: domaine
    label: Adresse du site (ex. https://www.etoile-business.com)
    type: string
    required: true
  - name: ville
    label: Ville
    type: string
    required: true
  - name: pays_code
    label: Code pays (CD = RDC)
    type: string
  - name: telephone_affiche
    label: Téléphone affiché (ex. +243 81 234 5678)
    type: string
  - name: telephone_lien
    label: Téléphone pour l'appel, sans espaces (ex. +243812345678)
    type: string
    required: true
  - name: whatsapp
    label: Numéro WhatsApp, chiffres seuls avec l'indicatif (ex. 243812345678)
    type: string
    required: true
  - name: email
    label: E-mail affiché
    type: string
  - name: email_lien
    label: E-mail pour le lien (ex. contact@etoile-business.com)
    type: string
  - name: horaires_fr
    label: Horaires (français)
    type: string
  - name: horaires_en
    label: Horaires (anglais)
    type: string
  - name: annonce_fr
    label: Bandeau d'annonce en haut du site (français)
    type: text
    description: 'Laisser vide pour ne rien afficher. Ex. : Fermé le 30 juin.'
  - name: annonce_en
    label: Bandeau d'annonce (anglais)
    type: text
  - name: web3forms_cle
    label: Clé Web3Forms du formulaire
    type: string
    description: Reçue par e-mail sur web3forms.com. Elle détermine l'adresse qui reçoit les messages.
  - name: agences
    label: Agences
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{nom}'
    fields:
    - name: nom
      label: Nom de l'agence
      type: string
      required: true
    - name: adresse
      label: Adresse, commune
      type: string
      required: true
    - name: itineraire
      label: Lien d'itinéraire (Google Maps ou OpenStreetMap)
      type: string
    - name: photo
      label: Photo de l'agence (facultative, JPG ou WebP, moins de 300 Ko)
      type: image
      options:
        extensions:
        - jpg
        - jpeg
        - webp
        - png
  - name: reseaux
    label: Réseaux partenaires (noms en texte, sans logos)
    type: string
    list: true
  - name: taux
    label: Taux du jour (facultatif)
    type: object
    fields:
    - name: afficher
      label: Afficher le tableau des taux
      type: boolean
    - name: date
      label: Date des taux (ex. 28/10/2026)
      type: string
    - name: lignes
      label: Lignes
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{devise}'
      fields:
      - name: devise
        label: Devise (ex. USD → CDF)
        type: string
        required: true
      - name: achat
        label: Achat
        type: string
      - name: vente
        label: Vente
        type: string
- name: textes_fr
  label: Textes du site (français)
  type: file
  path: contenu/fr.json
  format: json
  fields: &id001
  - name: seo
    label: Référencement (titres et descriptions Google)
    type: object
    fields:
    - name: accueil
      label: Accueil
      type: object
      fields:
      - name: titre
        label: Titre Google (60 caractères max.)
        type: string
        required: true
      - name: description
        label: Description Google (155 caractères max.)
        type: text
    - name: services
      label: Services
      type: object
      fields:
      - name: titre
        label: Titre Google (60 caractères max.)
        type: string
        required: true
      - name: description
        label: Description Google (155 caractères max.)
        type: text
    - name: a_propos
      label: À propos
      type: object
      fields:
      - name: titre
        label: Titre Google (60 caractères max.)
        type: string
        required: true
      - name: description
        label: Description Google (155 caractères max.)
        type: text
    - name: contact
      label: Agences & contact
      type: object
      fields:
      - name: titre
        label: Titre Google (60 caractères max.)
        type: string
        required: true
      - name: description
        label: Description Google (155 caractères max.)
        type: text
    - name: mentions
      label: Mentions légales
      type: object
      fields:
      - name: titre
        label: Titre Google (60 caractères max.)
        type: string
        required: true
      - name: description
        label: Description Google (155 caractères max.)
        type: text
    - name: confidentialite
      label: Confidentialité
      type: object
      fields:
      - name: titre
        label: Titre Google (60 caractères max.)
        type: string
        required: true
      - name: description
        label: Description Google (155 caractères max.)
        type: text
  - name: pied_de_page
    label: Phrase du pied de page
    type: text
  - name: accueil
    label: Page d'accueil
    type: object
    fields:
    - name: surtitre
      label: Surtitre
      type: string
    - name: titre
      label: Grand titre
      type: string
      required: true
    - name: intro
      label: Texte d'introduction
      type: text
      description: 'Astuces : **mot** met en gras. Variables : {ville}, {telephone}, {email}, {horaires}, {reseaux}.'
    - name: confiance
      label: Ligne sous les boutons
      type: string
    - name: services_titre
      label: Titre « services »
      type: string
    - name: voir_services
      label: Lien « voir tous les services »
      type: string
    - name: reseaux_titre
      label: Titre « réseaux »
      type: string
    - name: reseaux_texte
      label: Texte « réseaux »
      type: text
    - name: etapes_titre
      label: Titre « étapes »
      type: string
    - name: etapes
      label: Étapes
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titre}'
      fields:
      - name: titre
        label: Titre
        type: string
        required: true
      - name: texte
        label: Texte
        type: text
    - name: agences_titre
      label: Titre « agences »
      type: string
    - name: cta_titre
      label: Titre de l'appel final
      type: string
    - name: cta_texte
      label: Texte de l'appel final
      type: text
  - name: services
    label: Page Services
    type: object
    fields:
    - name: titre
      label: Grand titre
      type: string
      required: true
    - name: intro
      label: Introduction
      type: text
      description: 'Astuces : **mot** met en gras. Variables : {ville}, {telephone}, {email}, {horaires}, {reseaux}.'
    - name: liste
      label: Services (aussi affichés sur l'accueil)
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{nom}'
      fields:
      - name: id
        label: Identifiant (lettres minuscules, sans espace)
        type: string
        required: true
      - name: icone
        label: Icône
        type: select
        options:
          values:
          - name: transfert
            label: Transfert
          - name: change
            label: Change
          - name: credit
            label: Crédit
          - name: abonnement
            label: Abonnement
          - name: colis
            label: Colis
          - name: etoile
            label: Étoile
      - name: nom
        label: Nom du service
        type: string
        required: true
      - name: bientot
        label: Pas encore disponible (badge « Bientôt »)
        type: boolean
      - name: resume
        label: Résumé (carte de l'accueil)
        type: text
      - name: description
        label: Description (page Services)
        type: text
      - name: details
        label: Points détaillés
        type: text
        list: true
        description: 'Astuces : **mot** met en gras. Variables : {ville}, {telephone}, {email}, {horaires}, {reseaux}.'
    - name: taux_titre
      label: Titre du tableau des taux
      type: string
    - name: taux_note
      label: Note sous le titre des taux
      type: string
    - name: faq_titre
      label: Titre de la FAQ
      type: string
    - name: faq
      label: Questions fréquentes
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{question}'
      fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: reponse
        label: Réponse
        type: text
        description: 'Astuces : **mot** met en gras. Variables : {ville}, {telephone}, {email}, {horaires}, {reseaux}.'
    - name: cta_titre
      label: Titre de l'appel final
      type: string
    - name: cta_texte
      label: Texte de l'appel final
      type: text
  - name: a_propos
    label: Page À propos
    type: object
    fields:
    - name: titre
      label: Grand titre
      type: string
      required: true
    - name: intro
      label: Introduction
      type: text
      description: 'Astuces : **mot** met en gras. Variables : {ville}, {telephone}, {email}, {horaires}, {reseaux}.'
    - name: histoire_titre
      label: Titre « histoire »
      type: string
    - name: histoire
      label: Notre histoire
      type: text
    - name: engagements_titre
      label: Titre « engagements »
      type: string
    - name: engagements
      label: Engagements
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titre}'
      fields:
      - name: titre
        label: Titre
        type: string
        required: true
      - name: texte
        label: Texte
        type: text
    - name: cadre_titre
      label: Titre « cadre »
      type: string
    - name: cadre_texte
      label: Texte « cadre »
      type: text
    - name: cta_titre
      label: Titre de l'appel final
      type: string
    - name: cta_texte
      label: Texte de l'appel final
      type: text
  - name: contact
    label: Page Agences & contact
    type: object
    fields:
    - name: titre
      label: Grand titre
      type: string
      required: true
    - name: intro
      label: Introduction
      type: text
    - name: agences_titre
      label: Titre « agences »
      type: string
    - name: formulaire_titre
      label: Titre du formulaire
      type: string
    - name: avertissement
      label: Encadré de mise en garde
      type: text
  - name: mentions
    label: Mentions légales
    type: object
    fields:
    - name: titre
      label: Titre
      type: string
      required: true
    - name: sections
      label: Sections
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titre}'
      fields:
      - name: titre
        label: Titre
        type: string
        required: true
      - name: texte
        label: Texte
        type: text
        description: 'Astuces : **mot** met en gras. Variables : {ville}, {telephone}, {email}, {horaires}, {reseaux}.'
  - name: confidentialite
    label: Politique de confidentialité
    type: object
    fields:
    - name: titre
      label: Titre
      type: string
      required: true
    - name: sections
      label: Sections
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titre}'
      fields:
      - name: titre
        label: Titre
        type: string
        required: true
      - name: texte
        label: Texte
        type: text
        description: 'Astuces : **mot** met en gras. Variables : {ville}, {telephone}, {email}, {horaires}, {reseaux}.'
- name: textes_en
  label: Textes du site (anglais)
  type: file
  path: contenu/en.json
  format: json
  fields: *id001
